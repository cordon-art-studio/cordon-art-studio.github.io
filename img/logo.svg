<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="az" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#00A1E4"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#141a21"/>
      <stop offset="1" stop-color="#0b0e11"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Anillo sutil (marco) -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#00A1E4" stroke-opacity="0.35" stroke-width="5"/>

  <!-- Monograma C: pincelada con remates redondos, abierta a la derecha -->
  <path d="M 349.2 144.9 A 145 145 0 1 0 349.2 367.1"
        fill="none" stroke="url(#az)" stroke-width="54" stroke-linecap="round"/>

  <!-- Gotas de pintura en la apertura de la C -->
  <circle cx="395" cy="190" r="17" fill="#ffffff"/>
  <circle cx="425" cy="256" r="13" fill="#FFC94D"/>
  <circle cx="400" cy="320" r="10" fill="#00A1E4"/>
</svg>
